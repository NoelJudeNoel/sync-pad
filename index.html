<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Sync Pad</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root {
  --bg: #1e1e1e;
  --fg: #d4d4d4;
  --bar-bg: #2a2a2a;
  --bar-fg: #999;
  --bar-border: #333;
  --status-on: #4caf50;
  --status-off: #f44336;
  --accent: #4fc3f7;
}
[data-theme="light"] {
  --bg: #f5f5f5;
  --fg: #333;
  --bar-bg: #e0e0e0;
  --bar-fg: #666;
  --bar-border: #ccc;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; background:var(--bg); overflow:hidden; display:flex; flex-direction:column; }

/* 编辑器 */
#editor {
  flex:1; width:100%; resize:none;
  background:transparent; color:var(--fg);
  border:none; outline:none;
  padding:20px; font-size:16px; line-height:1.6;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",monospace;
}

/* 状态指示 */
#status {
  position:fixed; top:12px; right:16px;
  font-size:12px; color:#555; font-family:monospace;
  pointer-events:none; user-select:none;
  transition:color .3s;
}

/* 底部栏 */
#bottom-bar {
  display:flex; align-items:center; gap:8px;
  padding:8px 16px;
  background:var(--bar-bg); color:var(--bar-fg);
  border-top:1px solid var(--bar-border);
  font-size:12px; flex-wrap:wrap; flex-shrink:0;
  user-select:none;
}
  #bottom-bar button {
    background:var(--bar-bg); border:1px solid var(--bar-border);
    color:var(--bar-fg); padding:6px 12px; border-radius:6px;
    cursor:pointer; font-size:12px; white-space:nowrap;
    display:inline-flex; align-items:center; gap:3px;
    transition:background .15s,color .15s;
    line-height:1.3;
  }
  #bottom-bar button:hover { background:var(--bar-border); color:var(--fg); }
  #bottom-bar button:active { transform:scale(.96); }
  #bottom-bar .spacer { flex:1; min-width:4px; }
  #bottom-bar .meta { color:var(--bar-fg); opacity:.6; white-space:nowrap; }
  #bottom-bar a { color:var(--accent); text-decoration:none; white-space:nowrap; }
  #bottom-bar a:hover { text-decoration:underline; }
  #theme-btn { font-size:15px; padding:4px 10px; }
  /* 键盘弹出时：隐藏备案号，底部栏紧贴键盘 */
  .keyboard-open .meta { display:none !important; }
  .keyboard-open #bottom-bar { position:fixed; left:0; right:0; bottom:0; z-index:100; }

  /* 配对页（全屏覆盖层） */
  #pairing-screen {
    display:none; position:fixed; top:0; left:0; right:0; bottom:0;
    flex-direction:column; align-items:center; justify-content:center;
    background:rgba(0,0,0,.88); color:var(--fg);
    z-index:50; padding:20px; text-align:center;
  }
  #pairing-screen.show { display:flex; }
  #pairing-screen h2 { margin-bottom:8px; font-weight:500; }
  #pairing-screen .room-id {
    font-size:24px; font-weight:700; letter-spacing:2px;
    color:var(--accent); margin:12px 0;
  }
  #pairing-screen .hint { opacity:.6; font-size:13px; margin-bottom:20px; }
  #pairing-screen .status-text { font-size:13px; margin-top:16px; }
  #qrcode { background:#fff; padding:12px; border-radius:8px; display:inline-block; }

  /* 编辑模式 */
  .editor-mode #editor { display:block; }
</style>
</head>
<body>

<textarea id="editor" autofocus placeholder="开始输入..."></textarea>
<div id="status">○</div>

<div id="pairing-screen" class="show">
  <h2>📡 Sync Pad</h2>
  <div class="hint">手机扫码即可加入同一房间</div>
  <div id="qrcode"></div>
  <div class="status-text" id="pairStatus">等待连接...</div>
</div>

<div id="bottom-bar">
  <button id="cut-btn">✂ 剪切</button>
  <button id="copy-btn">📋 复制</button>
  <button id="theme-btn" title="切换主题">🌙</button>
  <a href="https://eu-as.cn/2026/02/%e6%ac%a2%e8%bf%8e%e6%9d%a5%e5%88%b0%e4%b8%aa%e4%ba%baai%e8%a7%81%e8%a7%a3%e5%b0%8f%e7%ab%99/" target="_blank">关于本站</a>
  <div class="spacer"></div>
  <span class="meta">京ICP备2025154830号-3</span>
  <span class="meta">京公网安备11011202101615号</span>
</div>

<script>
// ─── 状态 ───
const editor = document.getElementById('editor');
const status = document.getElementById('status');
const bottomBar = document.getElementById('bottom-bar');
const pairingScreen = document.getElementById('pairing-screen');
const qrcodeContainer = document.getElementById('qrcode');
const displayRoomId = document.getElementById('displayRoomId');
const pairStatus = document.getElementById('pairStatus');
const cutBtn = document.getElementById('cut-btn');
const copyBtn = document.getElementById('copy-btn');
let paired = false;       // 是否配对（≥2 人在房间）
let isRePairing = false;  // 断线后重配模式
let qrCode = null;        // QRCode 实例引用
const themeBtn = document.getElementById('theme-btn');

let ws = null;
let debounceTimer = null;
let connected = false;
let wakeLock = null;
let reconnectTimer = null;
let isPeerUpdate = false;  // 防止本地 input 回响

// ─── 房间 ID ───
function getPathRoom() {
  const parts = window.location.pathname.split('/');
  // /s/xxx -> xxx; /s/ -> ''; /s -> ''
  if (parts.length >= 3 && parts[1] === 's' && parts[2]) return parts[2];
  return '';
}

function generateRoomId() {
  const bytes = new Uint8Array(16);
  crypto.getRandomValues(bytes);
  let id = '';
  const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
  for (let i = 0; i < 16; i++) id += chars[bytes[i] % chars.length];
  return id;
}

let roomId = getPathRoom();
let isPairingMode = false;

if (!roomId) {
  // 配对模式：生成房间 ID，更新 URL
  isPairingMode = true;
  roomId = generateRoomId();
  history.replaceState(null, '', '/s/' + roomId);
  document.body.classList.remove('editor-mode');
  // 生成二维码
  const qrUrl = window.location.origin + '/s/' + roomId;
  qrCode = new QRCode(qrcodeContainer, {
    text: qrUrl,
    width: 180,
    height: 180,
    colorDark: '#1e1e1e',
    colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.H
  });
} else {
  document.body.classList.add('editor-mode');
  pairingScreen.classList.remove('show');
  editor.style.display = '';
}

// ─── 主题 ───
function getSystemTheme() { return window.matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light'; }
let themeState = 'system'; // system | dark | light

function applyTheme(mode) {
  const sys = getSystemTheme();
  if (mode === 'system') {
    document.documentElement.removeAttribute('data-theme');
    themeBtn.textContent = sys === 'dark' ? '🌙' : '☀';
  } else if (mode === 'dark') {
    document.documentElement.removeAttribute('data-theme');
    themeBtn.textContent = '🌙';
  } else {
    document.documentElement.setAttribute('data-theme', 'light');
    themeBtn.textContent = '☀';
  }
}

// 三态切换: system → dark(强制暗) → light(强制亮) → system
themeBtn.addEventListener('click', () => {
  if (themeState === 'system') { themeState = 'dark'; applyTheme('dark'); }
  else if (themeState === 'dark') { themeState = 'light'; applyTheme('light'); }
  else { themeState = 'system'; applyTheme('system'); }
});
applyTheme('system');
window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change', () => {
  if (themeState === 'system') applyTheme('system');
});

// ─── 唤醒锁 ───
async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch(e) { /* 静默失败 */ }
}
function releaseWakeLock() {
  if (wakeLock) { wakeLock.release(); wakeLock = null; }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && connected) requestWakeLock();
  else if (document.visibilityState === 'hidden') releaseWakeLock();
});
function updateStatus(on) {
  connected = on;
  status.textContent = on ? '●' : '○';
  status.style.color = on ? 'var(--status-on)' : 'var(--status-off)';
  if (isRePairing) {
    pairStatus.textContent = on ? '✓ 服务已连接，等待手机重新扫码...' : '服务断开，重连中...';
  } else if (isPairingMode) {
    pairStatus.textContent = on ? '✓ 已连接，手机扫码加入' : '连接断开，重连中...';
  }
  if (on) requestWakeLock();
}

// ─── 重配：显示二维码覆盖层（保留编辑器内容） ───
function showRePairingScreen() {
  isRePairing = true;
  paired = false;
  pairingScreen.classList.add('show');
  // 清除旧二维码，重新生成
  qrcodeContainer.innerHTML = '';
  const qrUrl = window.location.origin + '/s/' + roomId;
  qrCode = new QRCode(qrcodeContainer, {
    text: qrUrl,
    width: 180,
    height: 180,
    colorDark: '#1e1e1e',
    colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.H
  });
  pairStatus.textContent = '手机已断开，请重新扫码';
  // 释放唤醒锁（手机已断）
  releaseWakeLock();
}
function connectWS() {
  const proto = window.location.protocol === 'https:' ? 'wss' : 'ws';
  const wsUrl = `${proto}://${window.location.host}/s/ws?room=${roomId}`;
  ws = new WebSocket(wsUrl);

  ws.onopen = () => { updateStatus(true); };

  ws.onmessage = (event) => {
    try {
      const msg = JSON.parse(event.data);

      // 有人加入房间 → 配对页/重配页自动跳转至编辑页
      if (msg.t === 'j') {
        if (isPairingMode || isRePairing) {
          // 清除配对标记
          isPairingMode = false;
          isRePairing = false;
          paired = true;
          // 切到编辑模式
          document.body.classList.add('editor-mode');
          pairingScreen.classList.remove('show');
          editor.style.display = '';
          editor.focus();
        }
        return;
      }

      // 有人离开 → 如果只剩自己，显示重配二维码
      if (msg.t === 'l' && msg.c === 1 && paired) {
        showRePairingScreen();
        return;
      }
      // msg.d = 文本内容, msg.p = 发送端光标位置（可选）
      const start = editor.selectionStart;
      const end = editor.selectionEnd;
      const wasFocused = document.activeElement === editor;

      if (editor.value !== msg.d) {
        isPeerUpdate = true;
        editor.value = msg.d;

        // 同步光标
        if (wasFocused && typeof msg.p === 'number') {
          const clampedPos = Math.min(msg.p, msg.d.length);
          try { editor.setSelectionRange(clampedPos, clampedPos); } catch(e) {}
        } else if (wasFocused) {
          try { editor.setSelectionRange(start, end); } catch(e) {}
        }
        isPeerUpdate = false;
      }
    } catch(e) { /* 忽略非 JSON 消息 */ }
  };

  ws.onclose = () => {
    updateStatus(false);
    releaseWakeLock();
    clearTimeout(reconnectTimer);
    reconnectTimer = setTimeout(connectWS, 3000);
  };

  ws.onerror = () => { ws.close(); };
}

// ─── 键盘弹出适配（手机端） ───
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', () => {
    const diff = window.innerHeight - window.visualViewport.height;
    const isKeyboard = diff > 80;
    document.body.classList.toggle('keyboard-open', isKeyboard);
    if (isKeyboard) {
      bottomBar.style.bottom = diff + 'px';
    } else {
      bottomBar.style.bottom = '';
    }
  });
}

// ─── 输入事件 ───
editor.addEventListener('input', () => {
  if (isPeerUpdate) return;
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({
        p: editor.selectionStart,
        d: editor.value
      }));
    }
  }, 200);
});

// ─── 剪贴/复制 ───
cutBtn.addEventListener('click', async () => {
  editor.focus();
  if (editor.selectionStart !== editor.selectionEnd) {
    document.execCommand('cut');
  } else {
    editor.select();
    document.execCommand('cut');
  }
});
copyBtn.addEventListener('click', async () => {
  editor.focus();
  if (editor.selectionStart !== editor.selectionEnd) {
    document.execCommand('copy');
  } else {
    editor.select();
    document.execCommand('copy');
  }
  // 取消选择，避免干扰
  setTimeout(() => { editor.setSelectionRange(editor.value.length, editor.value.length); }, 100);
});

// ─── 启动 ───
connectWS();
</script>
</body>
</html>
