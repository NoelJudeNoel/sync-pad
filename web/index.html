<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="base-path" content="/s">
<title>咕咕同步 — 手机语音输入实时同步到 PC</title>
<meta name="description" content="手机靠近嘴边小声用任意输入法语音输入，文字实时同步到 PC 的极简工具。">
<meta name="theme-color" content="#7EC6BC">
<link rel="icon" type="image/svg+xml" href="/s/assets/logo.svg" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="/s/assets/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/s/assets/icon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="/s/assets/apple-touch-icon.png">
<link rel="manifest" href="/s/manifest.webmanifest">
<link rel="stylesheet" href="/s/css/base.css?v=2">
<link rel="stylesheet" href="/s/css/layout.css?v=2">
<link rel="stylesheet" href="/s/css/components.css?v=2">
<link rel="stylesheet" href="/s/css/themes.css?v=2">
<script src="/s/js/qrcode.min.js?v=2"></script>
</head>
<body>

<textarea id="editor" autofocus placeholder="开始输入..."></textarea>
<div id="status">○</div>

<div id="pairing-screen" class="show">
  <img class="pairing-logo" src="/s/assets/logo.svg" alt="咕咕同步">
  <div class="hint">咕咕同步：语音输入到手机，自动同步到 PC</div>
  <div id="qrcode"></div>
  <div class="status-text" id="pairStatus">等待连接...</div>
</div>

<div id="bottom-bar">
  <button class="bar-btn" id="cut-btn" title="剪切">剪切</button>
  <button class="bar-btn" id="copy-btn" title="复制">复制</button>
  <button class="bar-btn" id="theme-btn" title="切换主题">🌙</button>
  <a class="bar-link" href="https://eu-as.cn/2026/07/sync-pad-open-source/" target="_blank">关于</a>
  <a class="bar-link" href="https://github.com/NoelJudeNoel/sync-pad" target="_blank" title="GitHub">GitHub</a>
  <div class="spacer"></div>
</div>

<script src="/s/js/room.js?v=2"></script>
<script src="/s/js/theme.js?v=2"></script>
<script src="/s/js/websocket.js?v=2"></script>
<script src="/s/js/ui.js?v=2"></script>
<script src="/s/js/app.js?v=2"></script>
</body>
</html>
